<style>
  :root{
    --grape:#2b1055;--grape2:#43107a;--pink:#ff5fa2;--yellow:#ffd23f;
    --mint:#3ff0c8;--sky:#5fc9ff;--coral:#ff7a59;--ink:#1b0a3d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    background:radial-gradient(120% 90% at 50% -10%, #7826c9 0%, var(--grape2) 42%, var(--grape) 100%);
    color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;
    display:flex;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom);
  }
  #app{width:100%;max-width:520px;height:100dvh;display:flex;flex-direction:column;position:relative;}
  .bubble{position:fixed;border-radius:50%;opacity:.14;filter:blur(1px);pointer-events:none;z-index:0;animation:float 9s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-26px)}}
  .screen{flex:1;display:none;flex-direction:column;z-index:2;padding:8px 4px 18px;}
  .screen.active{display:flex;animation:pop .35s cubic-bezier(.2,1.3,.4,1);}
  @keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
  .title-wrap{text-align:center;margin-top:8vh;}
  .logo{font-size:clamp(38px,13vw,64px);font-weight:900;line-height:1.05;text-shadow:0 5px 0 #b6237a,0 8px 18px rgba(0,0,0,.4);letter-spacing:-1px;}
  .logo .plus{display:inline-block;color:var(--yellow);animation:spin 4s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .subtitle{margin-top:14px;font-size:16px;color:#e7d8ff;font-weight:600;}
  .lvl-list{margin-top:auto;margin-bottom:6vh;display:flex;flex-direction:column;gap:16px;}
  .lvl{border:none;border-radius:26px;padding:22px 20px;font-family:inherit;cursor:pointer;display:flex;align-items:center;gap:16px;text-align:left;color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.22),0 12px 24px rgba(0,0,0,.28);transition:transform .12s,box-shadow .12s;position:relative;}
  .lvl:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
  .lvl.k{background:linear-gradient(135deg,#ffe36e,#ff9a3c);}
  .lvl.s{background:linear-gradient(135deg,#7af5d4,#3fb6ff);}
  .lvl .emo{font-size:46px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
  .lvl .txt b{font-size:24px;font-weight:900;display:block;}
  .lvl .txt span{font-size:14px;font-weight:700;opacity:.75;}
  .lvl .go{margin-left:auto;font-size:28px;}
  .top{display:flex;align-items:center;gap:10px;padding:6px 6px 0;}
  .back{background:rgba(255,255,255,.16);border:none;color:#fff;font-size:22px;width:46px;height:46px;border-radius:16px;cursor:pointer;font-family:inherit;}
  .back:active{background:rgba(255,255,255,.3);}
  .stars{flex:1;display:flex;justify-content:center;gap:6px;}
  .star{font-size:30px;filter:grayscale(1) opacity(.4);transition:.3s;}
  .star.on{filter:none;animation:starpop .5s cubic-bezier(.2,1.6,.4,1);}
  @keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
  .modechip{background:rgba(0,0,0,.25);padding:8px 12px;border-radius:14px;font-size:13px;font-weight:800;}
  .qwrap{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px;}
  .mascot{font-size:56px;animation:bob 2s ease-in-out infinite;}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
  .card{background:#fff;color:var(--ink);border-radius:30px;padding:26px 20px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.3);text-align:center;}
  .q{font-size:clamp(46px,15vw,78px);font-weight:900;letter-spacing:1px;white-space:nowrap;}
  .q.lg{font-size:clamp(30px,9.5vw,54px);letter-spacing:0;}
  .q .op{color:var(--pink);}.q .eq{color:#c9c2e0;}.q .blank{display:inline-block;min-width:1.1em;color:var(--sky);}
  .answers{display:grid;gap:14px;margin-top:10px;width:100%;grid-template-columns:repeat(2,1fr);}
  .answers.three{grid-template-columns:repeat(3,1fr);}
  .ans{border:none;border-radius:22px;padding:22px 8px;font-family:inherit;font-size:clamp(30px,9vw,42px);font-weight:900;color:var(--ink);cursor:pointer;background:linear-gradient(160deg,#fff,#e9e2ff);box-shadow:0 6px 0 #bca9e8,0 8px 16px rgba(0,0,0,.25);transition:transform .1s,box-shadow .1s;}
  .ans:active{transform:translateY(5px);box-shadow:0 1px 0 #bca9e8;}
  .ans.right{background:linear-gradient(160deg,#8dffcf,#31d98f);box-shadow:0 6px 0 #17a463;animation:correct .45s;}
  .ans.wrong{background:linear-gradient(160deg,#ffb3b3,#ff6b6b);box-shadow:0 6px 0 #c23b3b;animation:shake .4s;}
  @keyframes correct{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
  .feedback{height:40px;margin-top:8px;text-align:center;font-size:22px;font-weight:900;opacity:0;transition:.2s;text-shadow:0 2px 6px rgba(0,0,0,.35);}
  .feedback.show{opacity:1;animation:fbpop .4s;}
  @keyframes fbpop{from{transform:scale(.6)}to{transform:scale(1)}}
  #reward{position:absolute;inset:0;z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(90% 70% at 50% 40%,#ff8ec7 0%,#7a2bd6 60%,#2b1055 100%);}
  #reward.show{display:flex;animation:pop .4s cubic-bezier(.2,1.4,.4,1);}
  .rew-emo{font-size:130px;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.4));animation:wobble 1.1s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:translateY(0) rotate(-7deg) scale(1)}50%{transform:translateY(-22px) rotate(7deg) scale(1.08)}}
  .rew-name{margin-top:12px;font-size:30px;font-weight:900;color:var(--yellow);text-shadow:0 3px 0 #b6237a,0 5px 12px rgba(0,0,0,.4);}
  .rew-praise{margin-top:10px;font-size:22px;font-weight:800;}
  .rew-sub{margin-top:6px;font-size:15px;color:#ffe0f0;font-weight:600;}
  .rew-btn{margin-top:30px;border:none;border-radius:24px;padding:18px 34px;font-family:inherit;font-size:22px;font-weight:900;color:var(--ink);cursor:pointer;background:linear-gradient(160deg,var(--yellow),#ff9a3c);box-shadow:0 7px 0 #c9721a,0 10px 20px rgba(0,0,0,.35);}
  .rew-btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c9721a;}
  .confetti{position:absolute;top:-20px;width:12px;height:16px;z-index:5;pointer-events:none;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg);opacity:.9}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;}}
</style>
</head>
<body>
<div id="app">
  <section id="start" class="screen active">
    <div class="title-wrap">
      <div class="logo">덧셈 <span class="plus">➕</span><br>대모험</div>
      <div class="subtitle">별 5개 모으고 이상한 친구 만나기! 🌟</div>
    </div>
    <div class="lvl-list">
      <button class="lvl k" onclick="startGame('k')">
        <span class="emo">🧸</span>
        <span class="txt"><b>유치원</b><span>6살 · 10까지 더하기</span></span>
        <span class="go">▶</span>
      </button>
      <button class="lvl s" onclick="startGame('s')">
        <span class="emo">🚀</span>
        <span class="txt"><b>초등 3학년</b><span>큰 수 더하기 · 받아올림</span></span>
        <span class="go">▶</span>
      </button>
    </div>
  </section>

  <section id="game" class="screen">
    <div class="top">
      <button class="back" onclick="goHome()">←</button>
      <div class="stars" id="stars"></div>
      <div class="modechip" id="modechip">유치원</div>
    </div>
    <div class="qwrap">
      <div class="mascot" id="mascot">🐣</div>
      <div class="card"><div class="q" id="question"></div></div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback"></div>
    </div>
  </section>

  <div id="reward">
    <div class="rew-emo" id="rewEmo">🦈</div>
    <div class="rew-name" id="rewName"></div>
    <div class="rew-praise" id="rewPraise"></div>
    <div class="rew-sub">별 5개 모았다! 진짜 최고야! 🎉</div>
    <button class="rew-btn" onclick="nextRound()">계속 하기 ▶</button>
  </div>
</div>

<script>
(function(){
  const cols=['#ff5fa2','#ffd23f','#3ff0c8','#5fc9ff','#ff7a59'];
  for(let i=0;i<7;i++){const b=document.createElement('div');b.className='bubble';const s=50+Math.random()*120;b.style.width=b.style.height=s+'px';b.style.left=Math.random()*100+'%';b.style.top=Math.random()*100+'%';b.style.background=cols[i%cols.length];b.style.animationDelay=(-Math.random()*9)+'s';document.body.appendChild(b);}
})();
const FRIENDS=[
  {e:'🦈',x:'👟',n:'샤크샤크 스니커리노'},{e:'🐊',x:'✈️',n:'크로코딜로 봄바르디노'},
  {e:'🐘',x:'🌵',n:'엘레판테 카투시노'},{e:'🐸',x:'☕',n:'프로기토 카푸치노'},
  {e:'🦆',x:'🚀',n:'덕덕 로케티노'},{e:'🐙',x:'🎩',n:'옥토 마제스티코'},
  {e:'🦥',x:'🍕',n:'슬로우 피자리노'},{e:'🐧',x:'🎸',n:'핑구 록카롤로'},
  {e:'🦖',x:'🍦',n:'다이노 젤라티노'},{e:'🐹',x:'🥁',n:'햄스터 봉고봉고'},
  {e:'🦩',x:'🕶️',n:'플라밍고 쿨리시모'},{e:'🐌',x:'🏎️',n:'스네일 스피디노'},
];
const PRAISE=['우와아 대박!','천재 아니야?!','완전 최고!','짱짱맨!','너무 잘한다!','폭풍 성장 중!','수학왕 등극!'];
let mode='k',correctCount=0,current=null;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function goHome(){$('reward').classList.remove('show');show('start');}
function startGame(m){mode=m;correctCount=0;$('modechip').textContent=(m==='k')?'유치원 🧸':'초3 🚀';buildStars();show('game');newQuestion();}
function buildStars(){const w=$('stars');w.innerHTML='';for(let i=0;i<5;i++){const s=document.createElement('span');s.className='star';s.textContent='⭐';w.appendChild(s);}paintStars();}
function paintStars(){const got=correctCount%5;document.querySelectorAll('.star').forEach((s,i)=>s.classList.toggle('on',i<got));}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function makeProblem(){let a,b;if(mode==='k'){a=rand(1,8);b=rand(1,10-a);}else{const r=Math.random();if(r<0.25){a=rand(11,49);b=rand(11,49);}else if(r<0.50){a=rand(100,899);b=rand(2,9);}else if(r<0.75){a=rand(100,799);b=rand(11,89);}else{a=rand(105,499);b=rand(105,499);}}return {a,b,ans:a+b};}
function makeChoices(ans){const set=new Set([ans]);let spread;if(mode==='k')spread=[1,2,3];else if(ans<100)spread=[1,2,9,10,11,20];else spread=[1,2,10,11,20,90,100,110];while(set.size<(mode==='k'?3:4)){let d=spread[rand(0,spread.length-1)]*(Math.random()<0.5?-1:1);let v=ans+d;if(v>0&&!set.has(v))set.add(v);}return [...set].sort(()=>Math.random()-0.5);}
const MASCOTS=['🐣','🐰','🦊','🐨','🐵','🦁','🐮','🐷'];
function newQuestion(){current=makeProblem();$('mascot').textContent=MASCOTS[rand(0,MASCOTS.length-1)];const q=$('question');q.classList.toggle('lg',(current.a>=100||current.b>=100));q.innerHTML=`${current.a} <span class="op">+</span> ${current.b} <span class="eq">=</span> <span class="blank">?</span>`;const box=$('answers');box.innerHTML='';const choices=makeChoices(current.ans);box.className='answers'+(choices.length===3?' three':'');choices.forEach(c=>{const btn=document.createElement('button');btn.className='ans';btn.textContent=c;btn.onclick=()=>pick(btn,c);box.appendChild(btn);});$('feedback').classList.remove('show');}
function pick(btn,val){if(btn.disabled)return;document.querySelectorAll('.ans').forEach(b=>b.disabled=true);const fb=$('feedback');if(val===current.ans){btn.classList.add('right');beep(880,0.12);setTimeout(()=>beep(1320,0.16),110);fb.textContent='딩동댕! 정답! 🎉';fb.style.color='#7dffbf';fb.classList.add('show');correctCount++;paintStars();setTimeout(()=>{if(correctCount%5===0)showReward();else newQuestion();},850);}else{btn.classList.add('wrong');beep(180,0.25);fb.textContent=`아깝다! 정답은 ${current.ans} 👀`;fb.style.color='#ffd0d0';fb.classList.add('show');document.querySelectorAll('.ans').forEach(b=>{if(Number(b.textContent)===current.ans)b.classList.add('right');});setTimeout(()=>{document.querySelectorAll('.ans').forEach(b=>b.disabled=false);newQuestion();},1500);}}
function showReward(){const f=FRIENDS[rand(0,FRIENDS.length-1)];$('rewEmo').textContent=f.e+f.x;$('rewName').textContent='"'+f.n+'"';$('rewPraise').textContent=PRAISE[rand(0,PRAISE.length-1)];$('reward').classList.add('show');fanfare();confetti();}
function nextRound(){$('reward').classList.remove('show');paintStars();newQuestion();}
function confetti(){const cols=['#ff5fa2','#ffd23f','#3ff0c8','#5fc9ff','#ff7a59','#fff'];for(let i=0;i<60;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[rand(0,cols.length-1)];c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*0.4)+'s';if(Math.random()<0.5)c.style.borderRadius='50%';$('reward').appendChild(c);setTimeout(()=>c.remove(),3600);}}
let AC;
function beep(freq,dur){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=freq;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(0.0001,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+dur);o.start();o.stop(AC.currentTime+dur+0.02);}catch(e){}}
function fanfare(){[523,659,784,1047].forEach((n,i)=>setTimeout(()=>beep(n,0.22),i*130));}
window.startGame=startGame;window.goHome=goHome;window.nextRound=nextRound;

</script>
</body>
</html>
