<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>하늘의 전투기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0b1020;
    --panel:rgba(9,14,32,.88);
    --line:#2b3a6b;
    --text:#eaf2ff;
    --dim:#93a4d0;
    --accent:#ffd166;
    --danger:#ff5d6c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:radial-gradient(circle at 50% 0%, #1b2a55 0%, #0b1020 60%, #05070f 100%);
    color:var(--text);
    font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;user-select:none;touch-action:none;
  }
  #wrap{
    position:relative;
    aspect-ratio:480/720;
    height:100vh;height:100dvh;
    max-width:100vw;
    box-shadow:0 0 60px rgba(0,0,0,.6);
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;background:#8fd0f2}
  .overlay{
    position:absolute;inset:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:24px;
    background:linear-gradient(180deg, rgba(6,10,24,.82), rgba(6,10,24,.92));
    backdrop-filter:blur(3px);
  }
  .overlay.hidden{display:none}
  .overlay h1{
    font-size:clamp(28px,8vw,44px);
    letter-spacing:2px;
    color:var(--accent);
    text-shadow:0 4px 0 #a8791d, 0 0 24px rgba(255,209,102,.5);
  }
  .overlay h2{font-size:clamp(24px,7vw,36px);color:var(--danger);text-shadow:0 3px 0 #7d1f2a}
  .overlay p{color:var(--dim);font-size:clamp(14px,3.6vw,17px);line-height:1.7}
  .keys{
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    border-radius:14px;padding:12px 16px;
    font-size:clamp(13px,3.4vw,16px);color:#cfdcff;line-height:1.9;
  }
  .keys b{color:var(--accent)}
  .btn{
    border:none;border-radius:999px;cursor:pointer;
    font-family:inherit;font-size:clamp(17px,4.6vw,21px);
    padding:14px 40px;color:#20160a;
    background:linear-gradient(180deg,#ffe08a,#ffc23c);
    box-shadow:0 5px 0 #c8901c, 0 8px 18px rgba(0,0,0,.4);
    transition:transform .06s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c8901c}
  .score-line{font-size:clamp(16px,4.4vw,20px);color:#fff}
  .score-line span{color:var(--accent)}
  #topbtns{
    position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5;
  }
  .mini{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);font-family:inherit;font-size:17px;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .mini:active{background:#1a2547}
  #bombbtn{
    position:absolute;right:14px;bottom:14px;z-index:5;
    width:72px;height:72px;border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    background:radial-gradient(circle at 35% 30%, #ff8f5d, #d33a2c);
    color:#fff;font-family:inherit;font-size:13px;line-height:1.2;
    box-shadow:0 4px 14px rgba(0,0,0,.45);
    display:none;flex-direction:column;align-items:center;justify-content:center;
  }
  #bombbtn:active{transform:scale(.94)}
  #bombbtn b{font-size:19px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>

  <div id="topbtns">
    <button class="mini" id="soundBtn" title="소리">🔊</button>
    <button class="mini" id="pauseBtn" title="일시정지">⏸</button>
  </div>

  <button id="bombbtn"><b>💣</b>폭탄</button>

  <div class="overlay" id="titleScreen">
    <h1>✈ 하늘의 전투기</h1>
    <p>미사일을 쏘고, 적이 떨어뜨리는<br>포탄을 피해 하늘을 지켜라!</p>
    <div class="keys">
      <b>이동</b> ← → ↑ ↓ / 화면 드래그<br>
      <b>미사일</b> 자동 발사<br>
      <b>폭탄</b> 스페이스 / 💣 버튼<br>
      <b>일시정지</b> P
    </div>
    <button class="btn" id="startBtn">게임 시작</button>
    <p id="bestLine" class="score-line"></p>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <h1>일시정지</h1>
    <button class="btn" id="resumeBtn">계속하기</button>
  </div>

  <div class="overlay hidden" id="overScreen">
    <h2>격추당했다!</h2>
    <p class="score-line">점수 <span id="finalScore">0</span></p>
    <p class="score-line">최고 점수 <span id="bestScore">0</span></p>
    <p id="rankLine"></p>
    <button class="btn" id="retryBtn">다시 도전</button>
  </div>
</div>

<script>
(function(){
'use strict';

/* ===================== 기본 설정 ===================== */
const W = 480, H = 720, GROUND = H - 46;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = W * dpr;
  cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

const rand  = (a,b) => a + Math.random()*(b-a);
const randi = (a,b) => Math.floor(rand(a,b+1));
const clamp = (v,a,b) => v<a?a:(v>b?b:v);
const hitCircle = (a,b) => {
  const dx=a.x-b.x, dy=a.y-b.y, r=a.r+b.r;
  return dx*dx+dy*dy < r*r;
};

/* ===================== 소리 ===================== */
let audioCtx = null, muted = false;
function sfx(type){
  if(muted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    if(type === 'shot'){
      o.type='square'; o.frequency.setValueAtTime(880,t);
      o.frequency.exponentialRampToValueAtTime(320,t+0.07);
      g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.08);
      o.start(t); o.stop(t+0.09);
    }else if(type === 'boom'){
      o.type='sawtooth'; o.frequency.setValueAtTime(180,t);
      o.frequency.exponentialRampToValueAtTime(40,t+0.3);
      g.gain.setValueAtTime(0.16,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.32);
      o.start(t); o.stop(t+0.33);
    }else if(type === 'item'){
      o.type='triangle'; o.frequency.setValueAtTime(520,t);
      o.frequency.setValueAtTime(780,t+0.08);
      o.frequency.setValueAtTime(1040,t+0.16);
      g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.28);
      o.start(t); o.stop(t+0.3);
    }else if(type === 'hurt'){
      o.type='square'; o.frequency.setValueAtTime(300,t);
      o.frequency.exponentialRampToValueAtTime(70,t+0.4);
      g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.42);
      o.start(t); o.stop(t+0.43);
    }else if(type === 'bomb'){
      o.type='sawtooth'; o.frequency.setValueAtTime(90,t);
      o.frequency.exponentialRampToValueAtTime(1200,t+0.25);
      g.gain.setValueAtTime(0.14,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      o.start(t); o.stop(t+0.42);
    }
  }catch(e){ /* 소리 실패해도 게임은 계속 */ }
}

/* ===================== 상태 ===================== */
let state = 'title';   // title | play | pause | over
let score = 0, level = 1, levelTime = 0, shake = 0, flash = 0, timeAll = 0;
let best = 0;
try{ best = parseInt(localStorage.getItem('sky_best') || '0', 10) || 0; }catch(e){ best = 0; }

const player = {
  x: W/2, y: H-130, r: 11,
  lives: 3, bombs: 3, weapon: 1,
  cool: 0, shield: 0, inv: 0, tilt: 0, alive: true
};

let bullets = [];   // 플레이어 미사일
let enemies = [];
let ebullets = [];  // 적 총알
let shells = [];    // 떨어지는 포탄
let blasts = [];    // 포탄 폭발 범위
let items = [];
let parts = [];
let rings = [];
let clouds = [];
let spawnTimer = 0;
let boss = null;
let bossWarn = 0;

/* ===================== 배경 ===================== */
function initClouds(){
  clouds = [];
  for(let i=0;i<9;i++){
    clouds.push({ x: rand(0,W), y: rand(-100,H), s: rand(0.5,1.5), v: rand(18,52), a: rand(0.25,0.6) });
  }
}
initClouds();

function updateBg(dt){
  for(const c of clouds){
    c.y += c.v*dt;
    if(c.y - 60*c.s > H){ c.y = -70*c.s; c.x = rand(0,W); c.s = rand(0.5,1.5); c.v = rand(18,52); }
  }
}

function drawBg(){
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#1b4f8c');
  g.addColorStop(0.35,'#4a9fd4');
  g.addColorStop(0.75,'#9fdcf5');
  g.addColorStop(1,'#d9f2ff');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  for(const c of clouds){
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, 46*c.s, 18*c.s, 0, 0, Math.PI*2);
    ctx.ellipse(c.x-26*c.s, c.y+6*c.s, 26*c.s, 13*c.s, 0, 0, Math.PI*2);
    ctx.ellipse(c.x+28*c.s, c.y+7*c.s, 30*c.s, 14*c.s, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  // 저 아래 땅
  ctx.fillStyle = '#3f7d3a';
  ctx.fillRect(0, GROUND, W, H-GROUND);
  ctx.fillStyle = '#356b31';
  const off = (timeAll*40) % 60;
  for(let x=-60; x<W+60; x+=60){
    ctx.fillRect(x + off - 30, GROUND+18, 34, 10);
  }
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.fillRect(0, GROUND, W, 4);
}

/* ===================== 이펙트 ===================== */
function spawnParts(x,y,n,colors,spd,size){
  for(let i=0;i<n;i++){
    const a = rand(0,Math.PI*2), s = rand(spd*0.3, spd);
    parts.push({
      x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s,
      life: rand(0.3,0.8), max: 0.8,
      c: colors[randi(0,colors.length-1)],
      sz: rand(size*0.5, size)
    });
  }
}
function explode(x,y,size,strong){
  spawnParts(x,y, strong?26:14, ['#fff3b0','#ffb703','#fb8500','#ff5d3b','#8d99ae'], strong?280:190, size*0.35);
  rings.push({x,y,r:size*0.3,max:size*2.1,life:1,c:'#ffd166'});
  shake = Math.min(shake + (strong?12:6), 18);
  sfx('boom');
}

/* ===================== 플레이어 ===================== */
function resetPlayer(){
  player.x = W/2; player.y = H-130;
  player.lives = 3; player.bombs = 3; player.weapon = 1;
  player.cool = 0; player.shield = 0; player.inv = 2; player.tilt = 0;
  player.alive = true;
}

function shoot(){
  const y = player.y - 16;
  const lv = player.weapon;
  const add = (x, vx, vy) => bullets.push({x, y, vx, vy, r:5, dmg:1});
  if(lv === 1){
    add(player.x, 0, -640);
  }else if(lv === 2){
    add(player.x-9, 0, -660); add(player.x+9, 0, -660);
  }else if(lv === 3){
    add(player.x, 0, -700);
    add(player.x-13, -120, -640); add(player.x+13, 120, -640);
  }else{
    add(player.x-8, 0, -720); add(player.x+8, 0, -720);
    add(player.x-16, -160, -640); add(player.x+16, 160, -640);
    add(player.x-22, -300, -540); add(player.x+22, 300, -540);
  }
  sfx('shot');
}

function useBomb(){
  if(state !== 'play' || player.bombs <= 0 || !player.alive) return;
  player.bombs--;
  flash = 1;
  shake = 16;
  sfx('bomb');
  ebullets.length = 0;
  for(const s of shells){ explode(s.x, s.y, 26, false); }
  shells.length = 0;
  for(const e of enemies){
    e.hp -= 5;
    spawnParts(e.x, e.y, 8, ['#fff','#ffd166'], 160, 5);
  }
  if(boss){ boss.hp -= 22; spawnParts(boss.x, boss.y, 20, ['#fff','#ffd166'], 220, 7); }
  rings.push({x:player.x, y:player.y, r:20, max:W*1.4, life:1, c:'#ffffff'});
  updateHUDButtons();
}

function hurtPlayer(){
  if(player.inv > 0 || !player.alive) return;
  if(player.shield > 0){
    player.shield = 0;
    player.inv = 1.2;
    rings.push({x:player.x,y:player.y,r:18,max:70,life:1,c:'#7ee8fa'});
    sfx('hurt');
    return;
  }
  player.lives--;
  player.weapon = Math.max(1, player.weapon-1);
  player.inv = 2.2;
  explode(player.x, player.y, 34, true);
  sfx('hurt');
  if(player.lives < 0){
    player.alive = false;
    gameOver();
  }
}

/* ===================== 적 ===================== */
function spawnFighter(x){
  enemies.push({
    kind:'fighter', x: x!==undefined?x:rand(40,W-40), y:-40, r:16, hp:2,
    vy: 78 + level*7, phase: rand(0,Math.PI*2), amp: rand(30,70),
    baseX: 0, cool: rand(1.2,2.6), score:100, c:'#e94f4f'
  });
  const e = enemies[enemies.length-1];
  e.baseX = e.x;
}
function spawnScout(){
  const x = rand(30, W-30);
  const dx = clamp((player.x - x)*0.4, -140, 140);
  enemies.push({
    kind:'scout', x, y:-30, r:13, hp:1,
    vy: 205 + level*10, vx: dx, cool: 99, score:80, c:'#ffa62b'
  });
}
function spawnBomber(){
  const fromLeft = Math.random() < 0.5;
  enemies.push({
    kind:'bomber',
    x: fromLeft ? -50 : W+50,
    y: rand(90, 190), r: 26, hp: 6 + level,
    vx: (fromLeft?1:-1) * (60 + level*5), vy: 0,
    cool: rand(0.6,1.4), score:250, c:'#6b7a99'
  });
}
function spawnBoss(){
  boss = {
    kind:'boss', x: W/2, y: -90, r: 50,
    hp: 40 + level*22, maxHp: 40 + level*22,
    vx: 70 + level*6, entering: true,
    cool: 1.6, bombCool: 1.2, score: 1500 + level*400
  };
  bossWarn = 2.2;
}

function dropShell(x, y, vx){
  shells.push({ x, y, vx: vx||0, vy: 60, r: 9, rot: 0 });
}
function enemyShot(x,y,tx,ty,spd){
  const a = Math.atan2(ty-y, tx-x);
  ebullets.push({ x, y, vx: Math.cos(a)*spd, vy: Math.sin(a)*spd, r: 5 });
}

/* ===================== 아이템 ===================== */
function maybeDropItem(x,y,force){
  const roll = Math.random();
  if(!force && roll > 0.12) return;
  let t;
  const r = Math.random();
  if(force) t = r<0.5 ? 'P' : (r<0.8 ? 'B' : 'H');
  else t = r<0.45 ? 'P' : (r<0.75 ? 'S' : (r<0.93 ? 'B' : 'H'));
  items.push({ x, y, r: 13, vy: 70, t, wob: rand(0,6.28) });
}
function takeItem(it){
  sfx('item');
  if(it.t === 'P'){ player.weapon = Math.min(4, player.weapon+1); score += 50; }
  else if(it.t === 'S'){ player.shield = 10; }
  else if(it.t === 'B'){ player.bombs = Math.min(5, player.bombs+1); }
  else if(it.t === 'H'){ player.lives = Math.min(5, player.lives+1); }
  rings.push({x:it.x,y:it.y,r:8,max:52,life:1,c:'#b7ffb0'});
  updateHUDButtons();
}

/* ===================== 업데이트 ===================== */
function update(dt){
  timeAll += dt;
  levelTime += dt;
  updateBg(dt);
  if(shake > 0) shake = Math.max(0, shake - dt*40);
  if(flash > 0) flash = Math.max(0, flash - dt*2.2);
  if(bossWarn > 0) bossWarn -= dt;

  /* --- 플레이어 이동 --- */
  if(player.alive){
    let dx = 0, dy = 0;
    if(keys['ArrowLeft'] || keys['a']) dx -= 1;
    if(keys['ArrowRight']|| keys['d']) dx += 1;
    if(keys['ArrowUp']   || keys['w']) dy -= 1;
    if(keys['ArrowDown'] || keys['s']) dy += 1;
    if(dx || dy){
      const len = Math.hypot(dx,dy) || 1;
      player.x += dx/len * 330 * dt;
      player.y += dy/len * 330 * dt;
      pointer.active = false;
    }
    if(pointer.active){
      const tx = pointer.x, ty = pointer.y;
      const ex = tx - player.x, ey = ty - player.y;
      player.x += ex * Math.min(1, dt*16);
      player.y += ey * Math.min(1, dt*16);
      dx = clamp(ex/24, -1, 1);
    }
    player.tilt += (dx*0.32 - player.tilt) * Math.min(1, dt*10);
    player.x = clamp(player.x, 18, W-18);
    player.y = clamp(player.y, 40, GROUND-14);

    if(player.inv > 0) player.inv -= dt;
    if(player.shield > 0) player.shield -= dt;

    player.cool -= dt;
    if(player.cool <= 0){
      shoot();
      player.cool = player.weapon >= 3 ? 0.13 : 0.16;
    }
    // 엔진 불꽃
    if(Math.random() < 0.6){
      parts.push({x:player.x+rand(-4,4), y:player.y+16, vx:rand(-20,20), vy:rand(80,160),
        life:0.25, max:0.25, c:'#ffd166', sz:rand(2,4)});
    }
  }

  /* --- 적 생성 --- */
  if(!boss && bossWarn <= 0){
    spawnTimer -= dt;
    if(spawnTimer <= 0){
      const r = Math.random();
      if(r < 0.18 + level*0.02) spawnBomber();
      else if(r < 0.45) spawnScout();
      else if(r < 0.62){
        // V자 편대 (레벨이 오르면 더 커진다)
        const cx = rand(80, W-80);
        const n = level < 3 ? 1 : 2;
        for(let i=-n;i<=n;i++) spawnFighter(clamp(cx + i*34, 30, W-30));
      }else spawnFighter();
      spawnTimer = Math.max(0.5, 1.9 - level*0.09) * rand(0.75,1.3);
    }
    if(levelTime > 26) spawnBoss();
  }

  /* --- 적 업데이트 --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if(e.kind === 'fighter'){
      e.y += e.vy*dt;
      e.phase += dt*2;
      e.x = e.baseX + Math.sin(e.phase)*e.amp;
      e.cool -= dt;
      if(e.cool <= 0 && e.y > 20 && e.y < H*0.7 && player.alive){
        enemyShot(e.x, e.y+14, player.x, player.y, 165 + level*9);
        e.cool = Math.max(1.0, rand(1.8, 3.2) - level*0.08);
      }
    }else if(e.kind === 'scout'){
      e.y += e.vy*dt; e.x += e.vx*dt;
      if(e.x < 14 || e.x > W-14) e.vx *= -1;
    }else if(e.kind === 'bomber'){
      e.x += e.vx*dt;
      e.y += Math.sin(timeAll*1.5)*10*dt;
      e.cool -= dt;
      if(e.cool <= 0 && e.x > 10 && e.x < W-10){
        dropShell(e.x, e.y+18, e.vx*0.35);
        e.cool = rand(1.1, 2.0);
      }
    }
    if(e.y - e.r > H+30 || e.x < -90 || e.x > W+90){ enemies.splice(i,1); continue; }
    if(player.alive && hitCircle(e, player)){
      e.hp = 0;
      explode(e.x, e.y, e.r+8, false);
      enemies.splice(i,1);
      hurtPlayer();
    }
  }

  /* --- 보스 --- */
  if(boss){
    if(boss.entering){
      boss.y += 60*dt;
      if(boss.y >= 110) boss.entering = false;
    }else{
      boss.x += boss.vx*dt;
      if(boss.x < 70){ boss.x = 70; boss.vx *= -1; }
      if(boss.x > W-70){ boss.x = W-70; boss.vx *= -1; }
      boss.y = 110 + Math.sin(timeAll*1.2)*14;

      boss.cool -= dt;
      if(boss.cool <= 0 && player.alive){
        const base = Math.atan2(player.y-boss.y, player.x-boss.x);
        const n = level < 3 ? 1 : 2;
        for(let k=-n;k<=n;k++){
          const a = base + k*0.22;
          ebullets.push({x:boss.x, y:boss.y+26, vx:Math.cos(a)*200, vy:Math.sin(a)*200, r:6});
        }
        boss.cool = Math.max(0.7, 1.6 - level*0.08);
      }
      boss.bombCool -= dt;
      if(boss.bombCool <= 0){
        dropShell(boss.x-26, boss.y+30, -40);
        dropShell(boss.x+26, boss.y+30, 40);
        boss.bombCool = Math.max(0.8, 1.8 - level*0.08);
      }
    }
    if(player.alive && hitCircle(boss, player)) hurtPlayer();
    if(boss.hp <= 0){
      score += boss.score;
      explode(boss.x, boss.y, 90, true);
      for(let k=0;k<5;k++){
        explode(boss.x + rand(-50,50), boss.y + rand(-30,30), 34, false);
      }
      spawnParts(boss.x, boss.y, 50, ['#fff3b0','#ffb703','#ff5d3b'], 340, 9);
      maybeDropItem(boss.x-30, boss.y, true);
      maybeDropItem(boss.x+30, boss.y, true);
      boss = null;
      level++;
      levelTime = 0;
      flash = 0.6;
    }
  }

  /* --- 플레이어 미사일 --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y < -20 || b.x < -20 || b.x > W+20){ bullets.splice(i,1); continue; }
    let gone = false;
    for(let j=enemies.length-1;j>=0;j--){
      const e = enemies[j];
      if(hitCircle(b,e)){
        e.hp -= b.dmg;
        spawnParts(b.x, b.y, 4, ['#fff','#ffd166'], 120, 3);
        gone = true;
        if(e.hp <= 0){
          score += e.score;
          explode(e.x, e.y, e.r+6, e.kind==='bomber');
          maybeDropItem(e.x, e.y, false);
          enemies.splice(j,1);
        }
        break;
      }
    }
    if(!gone && boss && hitCircle(b, boss)){
      boss.hp -= b.dmg;
      spawnParts(b.x, b.y, 4, ['#fff','#ffd166'], 120, 3);
      gone = true;
    }
    if(gone) bullets.splice(i,1);
  }

  /* --- 적 총알 --- */
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.y > H+20 || b.y < -30 || b.x < -30 || b.x > W+30){ ebullets.splice(i,1); continue; }
    if(player.alive && hitCircle(b, player)){
      ebullets.splice(i,1);
      hurtPlayer();
    }
  }

  /* --- 포탄 --- */
  for(let i=shells.length-1;i>=0;i--){
    const s = shells[i];
    s.vy += 190*dt;
    s.x += s.vx*dt; s.y += s.vy*dt;
    s.rot += dt*3;
    let boom = false;
    if(s.y > GROUND-6) boom = true;
    if(player.alive && hitCircle(s, player)) boom = true;
    if(boom){
      blasts.push({x:s.x, y:Math.min(s.y, GROUND-4), r:14, max:64, life:0.45, dealt:false});
      explode(s.x, Math.min(s.y, GROUND-4), 30, false);
      shells.splice(i,1);
    }else if(s.y > H+40){
      shells.splice(i,1);
    }
  }

  /* --- 포탄 폭발 범위 --- */
  for(let i=blasts.length-1;i>=0;i--){
    const b = blasts[i];
    b.life -= dt;
    b.r += (b.max - b.r) * Math.min(1, dt*12);
    if(!b.dealt && player.alive){
      const dx = player.x-b.x, dy = player.y-b.y;
      if(dx*dx+dy*dy < (b.r+player.r)*(b.r+player.r)){
        b.dealt = true;
        hurtPlayer();
      }
    }
    if(b.life <= 0) blasts.splice(i,1);
  }

  /* --- 아이템 --- */
  for(let i=items.length-1;i>=0;i--){
    const it = items[i];
    it.y += it.vy*dt;
    it.wob += dt*4;
    it.x += Math.sin(it.wob)*22*dt;
    if(it.y > H+20){ items.splice(i,1); continue; }
    if(player.alive && hitCircle(it, player)){ takeItem(it); items.splice(i,1); }
  }

  /* --- 파티클 / 링 --- */
  for(let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.life -= dt;
    p.x += p.vx*dt; p.y += p.vy*dt;
    p.vx *= 0.96; p.vy = p.vy*0.96 + 120*dt;
    if(p.life <= 0) parts.splice(i,1);
  }
  for(let i=rings.length-1;i>=0;i--){
    const r = rings[i];
    r.life -= dt*2.2;
    r.r += (r.max - r.r) * Math.min(1, dt*7);
    if(r.life <= 0) rings.splice(i,1);
  }
}

/* ===================== 그리기 ===================== */
function drawPlane(x, y, tilt, scale, colors, flame){
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(tilt);
  ctx.scale(scale, scale);

  if(flame){
    const f = rand(10,20);
    ctx.fillStyle = '#ff9f1c';
    ctx.beginPath();
    ctx.moveTo(-6,14); ctx.lineTo(6,14); ctx.lineTo(0,14+f); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#fff3b0';
    ctx.beginPath();
    ctx.moveTo(-3,14); ctx.lineTo(3,14); ctx.lineTo(0,14+f*0.55); ctx.closePath();
    ctx.fill();
  }
  // 날개
  ctx.fillStyle = colors.wing;
  ctx.beginPath();
  ctx.moveTo(0,-4); ctx.lineTo(22,10); ctx.lineTo(8,12); ctx.lineTo(0,6);
  ctx.lineTo(-8,12); ctx.lineTo(-22,10); ctx.closePath();
  ctx.fill();
  // 꼬리
  ctx.beginPath();
  ctx.moveTo(0,8); ctx.lineTo(10,17); ctx.lineTo(-10,17); ctx.closePath();
  ctx.fill();
  // 몸통
  ctx.fillStyle = colors.body;
  ctx.beginPath();
  ctx.moveTo(0,-19);
  ctx.quadraticCurveTo(7,-6, 7,12);
  ctx.lineTo(-7,12);
  ctx.quadraticCurveTo(-7,-6, 0,-19);
  ctx.fill();
  // 조종석
  ctx.fillStyle = colors.glass;
  ctx.beginPath();
  ctx.ellipse(0,-5,4.2,6.5,0,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  if(!player.alive) return;
  if(player.inv > 0 && Math.floor(player.inv*12) % 2 === 0) return;
  if(player.shield > 0){
    ctx.save();
    ctx.globalAlpha = 0.35 + Math.sin(timeAll*8)*0.12;
    ctx.strokeStyle = '#7ee8fa';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(player.x, player.y, 27, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }
  drawPlane(player.x, player.y, player.tilt, 1,
    {body:'#f2f6ff', wing:'#3a86ff', glass:'#123'} , true);
}

function drawEnemy(e){
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(Math.PI);  // 아래를 향한 적기
  ctx.translate(-e.x, -e.y);
  if(e.kind === 'bomber'){
    ctx.save();
    ctx.translate(e.x,e.y); ctx.scale(1.5,1.2); ctx.translate(-e.x,-e.y);
    drawPlane(e.x, e.y, 0, 1, {body:'#8b98b5', wing:'#4c5975', glass:'#20293d'}, false);
    ctx.restore();
  }else if(e.kind === 'scout'){
    drawPlane(e.x, e.y, 0, 0.8, {body:'#ffd166', wing:'#f77f00', glass:'#3a2400'}, true);
  }else{
    drawPlane(e.x, e.y, 0, 1, {body:'#ff7b7b', wing:'#c1121f', glass:'#3a0a0a'}, true);
  }
  ctx.restore();
}

function drawBoss(){
  if(!boss) return;
  const x = boss.x, y = boss.y;
  ctx.save();
  ctx.translate(x,y);
  // 본체
  ctx.fillStyle = '#5a6685';
  ctx.beginPath();
  ctx.moveTo(0,42);
  ctx.quadraticCurveTo(70,20, 58,-14);
  ctx.lineTo(-58,-14);
  ctx.quadraticCurveTo(-70,20, 0,42);
  ctx.fill();
  ctx.fillStyle = '#3d4763';
  ctx.fillRect(-64,-22,128,16);
  // 엔진
  ctx.fillStyle = '#2b3247';
  ctx.fillRect(-46,-14,18,26);
  ctx.fillRect(28,-14,18,26);
  ctx.fillStyle = '#ff9f1c';
  ctx.fillRect(-44,-20,14,7);
  ctx.fillRect(30,-20,14,7);
  // 조종석
  ctx.fillStyle = '#ffd166';
  ctx.beginPath(); ctx.ellipse(0,14,16,10,0,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#c1121f';
  ctx.beginPath(); ctx.ellipse(0,14,7,5,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // 체력바
  const bw = 200, bh = 9, bx = (W-bw)/2, by = 18;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(bx-3, by-3, bw+6, bh+6);
  ctx.fillStyle = '#3a0a12';
  ctx.fillRect(bx, by, bw, bh);
  const p = clamp(boss.hp/boss.maxHp, 0, 1);
  const gg = ctx.createLinearGradient(bx,0,bx+bw,0);
  gg.addColorStop(0,'#ff5d6c'); gg.addColorStop(1,'#ffd166');
  ctx.fillStyle = gg;
  ctx.fillRect(bx, by, bw*p, bh);
  ctx.fillStyle = '#fff';
  ctx.font = '12px Jua, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('보스', W/2, by-6);
}

function drawShell(s){
  ctx.save();
  ctx.translate(s.x, s.y);
  ctx.rotate(Math.atan2(s.vy, s.vx) - Math.PI/2);
  ctx.fillStyle = '#2f3542';
  ctx.beginPath();
  ctx.moveTo(0,-12);
  ctx.quadraticCurveTo(7,-4, 6,8);
  ctx.lineTo(-6,8);
  ctx.quadraticCurveTo(-7,-4, 0,-12);
  ctx.fill();
  ctx.fillStyle = '#ffd166';
  ctx.fillRect(-6,2,12,3);
  ctx.fillStyle = '#6c757d';
  ctx.beginPath();
  ctx.moveTo(-6,8); ctx.lineTo(-9,15); ctx.lineTo(0,11); ctx.lineTo(9,15); ctx.lineTo(6,8);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawItem(it){
  const col = it.t==='P' ? '#3a86ff' : it.t==='S' ? '#22c1c3' : it.t==='B' ? '#ef476f' : '#06d6a0';
  ctx.save();
  ctx.translate(it.x, it.y);
  ctx.rotate(Math.sin(it.wob)*0.25);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.fillRect(-12,-10,26,26);
  ctx.fillStyle = col;
  ctx.fillRect(-13,-13,26,26);
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(-13,-13,26,8);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Jua, sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(it.t, 0, 1);
  ctx.restore();
  ctx.textBaseline='alphabetic';
}

function drawHUD(){
  ctx.save();
  ctx.font = '18px Jua, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(8, 8, 150, 26);
  ctx.fillStyle = '#fff';
  ctx.fillText('점수 ' + score, 16, 27);

  // 생명
  for(let i=0;i<Math.max(0,player.lives);i++){
    drawPlane(24 + i*22, 52, 0, 0.5, {body:'#f2f6ff', wing:'#3a86ff', glass:'#123'}, false);
  }
  // 폭탄
  ctx.font = '14px Jua, sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('💣 x' + player.bombs, 14, 84);
  ctx.fillText('무기 LV' + player.weapon, 14, 104);

  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fillRect(W-120, 8, 112, 26);
  ctx.fillStyle = '#ffd166';
  ctx.font = '18px Jua, sans-serif';
  ctx.fillText('LEVEL ' + level, W-16, 27);
  ctx.restore();

  if(bossWarn > 0 && Math.floor(bossWarn*5) % 2 === 0){
    ctx.save();
    ctx.fillStyle = 'rgba(255,0,40,.16)';
    ctx.fillRect(0, H/2-60, W, 120);
    ctx.fillStyle = '#fff';
    ctx.font = '34px Jua, sans-serif';
    ctx.textAlign='center';
    ctx.fillText('경 고 !  보스 등장', W/2, H/2+10);
    ctx.restore();
  }
}

function render(){
  ctx.save();
  if(shake > 0) ctx.translate(rand(-shake,shake)*0.5, rand(-shake,shake)*0.5);

  drawBg();

  for(const it of items) drawItem(it);
  for(const e of enemies) drawEnemy(e);
  drawBoss();

  // 포탄 폭발
  for(const b of blasts){
    ctx.save();
    ctx.globalAlpha = clamp(b.life*2, 0, 1);
    const g = ctx.createRadialGradient(b.x,b.y,2,b.x,b.y,b.r);
    g.addColorStop(0,'rgba(255,255,220,.95)');
    g.addColorStop(0.5,'rgba(255,150,40,.6)');
    g.addColorStop(1,'rgba(255,60,20,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  for(const s of shells) drawShell(s);

  // 적 총알
  for(const b of ebullets){
    ctx.save();
    ctx.fillStyle = '#ff3b30';
    ctx.shadowColor = '#ff8b7a'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 플레이어 미사일
  for(const b of bullets){
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(Math.atan2(b.vy, b.vx) + Math.PI/2);
    ctx.fillStyle = '#ffe98a';
    ctx.beginPath(); ctx.moveTo(0,-9); ctx.lineTo(3.5,-2); ctx.lineTo(3.5,7); ctx.lineTo(-3.5,7); ctx.lineTo(-3.5,-2); ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#ff6b35';
    ctx.beginPath(); ctx.moveTo(-2.5,7); ctx.lineTo(2.5,7); ctx.lineTo(0,13); ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  drawPlayer();

  for(const p of parts){
    ctx.globalAlpha = clamp(p.life/p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz);
  }
  ctx.globalAlpha = 1;

  for(const r of rings){
    ctx.save();
    ctx.globalAlpha = clamp(r.life, 0, 1) * 0.7;
    ctx.strokeStyle = r.c;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI*2); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();

  if(flash > 0){
    ctx.fillStyle = 'rgba(255,255,255,' + (flash*0.55) + ')';
    ctx.fillRect(0,0,W,H);
  }
  if(state === 'play' || state === 'pause') drawHUD();
}

/* ===================== 루프 ===================== */
let last = performance.now();
function frame(t){
  const dt = Math.min((t - last)/1000, 1/30);
  last = t;
  if(state === 'play') update(dt);
  else { timeAll += dt; updateBg(dt*0.5); for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.life-=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.life<=0) parts.splice(i,1);} }
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===================== 화면 전환 ===================== */
const titleScreen = document.getElementById('titleScreen');
const pauseScreen = document.getElementById('pauseScreen');
const overScreen  = document.getElementById('overScreen');
const bombBtn     = document.getElementById('bombbtn');

function show(el, on){ el.classList.toggle('hidden', !on); }
function updateHUDButtons(){
  bombBtn.style.display = (state === 'play') ? 'flex' : 'none';
  bombBtn.style.opacity = player.bombs > 0 ? '1' : '.4';
}

function startGame(){
  score = 0; level = 1; levelTime = 0; timeAll = 0;
  bullets = []; enemies = []; ebullets = []; shells = [];
  blasts = []; items = []; parts = []; rings = [];
  boss = null; bossWarn = 0; spawnTimer = 1.4; shake = 0; flash = 0;
  resetPlayer();
  pointer.active = false;
  state = 'play';
  show(titleScreen,false); show(pauseScreen,false); show(overScreen,false);
  updateHUDButtons();
  if(!audioCtx){ sfx('item'); }
}

function gameOver(){
  state = 'over';
  if(score > best){
    best = score;
    try{ localStorage.setItem('sky_best', String(best)); }catch(e){}
  }
  document.getElementById('finalScore').textContent = score;
  document.getElementById('bestScore').textContent = best;
  document.getElementById('rankLine').textContent =
    score >= 20000 ? '🏆 전설의 에이스 파일럿!' :
    score >= 10000 ? '🥇 하늘의 지배자!' :
    score >= 5000  ? '🥈 훌륭한 조종사!' :
    score >= 2000  ? '🥉 제법인데?' : '🛩 다시 도전해 볼까?';
  show(overScreen, true);
  updateHUDButtons();
}

function togglePause(){
  if(state === 'play'){ state = 'pause'; show(pauseScreen,true); updateHUDButtons(); }
  else if(state === 'pause'){ state = 'play'; show(pauseScreen,false); last = performance.now(); updateHUDButtons(); }
}

document.getElementById('bestLine').textContent = best > 0 ? ('최고 점수 ' + best) : '';
document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('soundBtn').addEventListener('click', function(){
  muted = !muted;
  this.textContent = muted ? '🔇' : '🔊';
});
bombBtn.addEventListener('click', function(e){ e.preventDefault(); useBomb(); });

/* ===================== 입력 ===================== */
const keys = {};
window.addEventListener('keydown', e => {
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].indexOf(e.key) >= 0) e.preventDefault();
  keys[e.key] = true;
  if(e.key === ' ') useBomb();
  if(e.key === 'p' || e.key === 'P' || e.key === 'ㅔ') togglePause();
  if((e.key === 'Enter') && state !== 'play') startGame();
}, {passive:false});
window.addEventListener('keyup', e => { keys[e.key] = false; });

const pointer = { x: W/2, y: H-130, active:false };
function toLocal(clientX, clientY){
  const r = cv.getBoundingClientRect();
  return { x: (clientX - r.left) * W / r.width, y: (clientY - r.top) * H / r.height };
}
function onDown(e){
  if(state !== 'play') return;
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  pointer.x = p.x; pointer.y = p.y - 34;   // 손가락에 가리지 않게 살짝 위
  pointer.active = true;
  e.preventDefault();
}
function onMove(e){
  if(!pointer.active || state !== 'play') return;
  const t = e.touches ? e.touches[0] : e;
  const p = toLocal(t.clientX, t.clientY);
  pointer.x = p.x; pointer.y = p.y - 34;
  e.preventDefault();
}
function onUp(){ pointer.active = false; }
cv.addEventListener('touchstart', onDown, {passive:false});
cv.addEventListener('touchmove',  onMove, {passive:false});
cv.addEventListener('touchend',   onUp);
cv.addEventListener('mousedown',  onDown);
window.addEventListener('mousemove', onMove);
window.addEventListener('mouseup', onUp);

window.addEventListener('blur', () => { if(state === 'play') togglePause(); });

})();
</script>
