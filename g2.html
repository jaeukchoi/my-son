<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>TETRIS</title>
<style>
  :root{
    --bg:#0d1021;
    --panel:#161a33;
    --line:#262c52;
    --text:#e8eaf6;
    --dim:#8890b5;
    --accent:#ffd166;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Courier New', ui-monospace, monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:10px;user-select:none;touch-action:manipulation;
  }
  h1{
    font-size:22px;letter-spacing:12px;margin:4px 0 10px;text-indent:12px;
    color:var(--accent);text-shadow:0 0 14px rgba(255,209,102,.45);
  }
  .game{display:flex;gap:12px;align-items:flex-start}
  .side{display:flex;flex-direction:column;gap:10px;width:96px}
  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px;text-align:center;
  }
  .panel .label{font-size:10px;color:var(--dim);letter-spacing:2px;margin-bottom:4px}
  .panel .value{font-size:18px;font-weight:bold}
  canvas{display:block;background:#0a0d1c;border:1px solid var(--line);border-radius:8px}
  #board{box-shadow:0 0 30px rgba(0,0,0,.6);touch-action:none}
  .overlay{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(10,13,28,.82);border-radius:8px;gap:12px;
  }
  .overlay b{font-size:18px;letter-spacing:4px}
  .overlay .hint{font-size:11px;color:var(--dim)}
  .boardwrap{position:relative}
  button.btn{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:13px;padding:8px 18px;border-radius:8px;cursor:pointer;
    letter-spacing:2px;
  }
  button.btn:active{background:var(--line)}
  .keys{font-size:10px;color:var(--dim);margin-top:10px;text-align:center;line-height:1.7}
  /* touch controls */
  .touch{display:none;margin-top:12px;gap:8px}
  .touch button{
    width:56px;height:56px;font-size:20px;border-radius:12px;
    background:var(--panel);border:1px solid var(--line);color:var(--text);
  }
  .touch button:active{background:var(--line)}
  @media (pointer:coarse){
    .touch{display:flex}
    .keys{display:none}
  }
  /* 모바일: 패널을 상단 가로 배치, 보드는 화면에 맞춰 스케일 */
  @media (max-width:600px){
    body{overscroll-behavior:none;overflow:hidden}
    h1{font-size:15px;letter-spacing:7px;margin-bottom:6px}
    .game{flex-direction:column;align-items:center;gap:8px}
    .side{flex-direction:row;width:auto;justify-content:center;align-items:stretch;gap:6px}
    .side:first-of-type{order:1}
    .boardwrap{order:2}
    .side:last-of-type{order:1;position:absolute;visibility:hidden}
    .panel{padding:5px 8px;display:flex;flex-direction:column;justify-content:center}
    .panel .label{font-size:9px;margin-bottom:2px}
    .panel .value{font-size:14px}
    #hold{width:40px;height:30px}
    #board{width:min(94vw,44vh);height:auto}
    .touch{margin-top:8px;flex-wrap:wrap;justify-content:center}
    .touch button{width:52px;height:52px}
    /* NEXT를 상단 패널로 이동한 복제 캔버스 */
    #nextMiniPanel{display:flex}
    #nextMini{width:36px;height:81px}
  }
  #nextMiniPanel{display:none}
</style>
</head>
<body>
<h1>TETRIS</h1>
<div class="game">
  <div class="side">
    <div class="panel"><div class="label">HOLD</div><canvas id="hold" width="80" height="60"></canvas></div>
    <div class="panel"><div class="label">SCORE</div><div class="value" id="score">0</div></div>
    <div class="panel"><div class="label">LINES</div><div class="value" id="lines">0</div></div>
    <div class="panel"><div class="label">LEVEL</div><div class="value" id="level">1</div></div>
    <div class="panel" id="nextMiniPanel"><div class="label">NEXT</div><canvas id="nextMini" width="80" height="180"></canvas></div>
  </div>

  <div class="boardwrap">
    <canvas id="board" width="300" height="600"></canvas>
    <div class="overlay" id="overlay">
      <b id="ovTitle">TETRIS</b>
      <div class="hint" id="ovHint">방향키 이동 · ↑ 회전 · Space 하드드롭 · C 홀드 · P 일시정지</div>
      <button class="btn" id="startBtn">START</button>
    </div>
  </div>

  <div class="side">
    <div class="panel"><div class="label">NEXT</div><canvas id="next" width="80" height="180"></canvas></div>
  </div>
</div>

<div class="keys">← → 이동 &nbsp; ↓ 소프트드롭 &nbsp; ↑ / X 회전 &nbsp; Z 역회전 &nbsp; SPACE 하드드롭 &nbsp; C 홀드 &nbsp; P 일시정지</div>

<div class="touch">
  <button data-act="left">◀</button>
  <button data-act="rotate">⟳</button>
  <button data-act="right">▶</button>
  <button data-act="down">▼</button>
  <button data-act="drop">⤓</button>
  <button data-act="hold">H</button>
</div>

<script>
(() => {
const COLS=10, ROWS=20, SIZE=30;
const boardCv=document.getElementById('board'), bctx=boardCv.getContext('2d');
const nextCv=document.getElementById('next'), nctx=nextCv.getContext('2d');
const holdCv=document.getElementById('hold'), hctx=holdCv.getContext('2d');
const nextMiniCv=document.getElementById('nextMini'), nmctx=nextMiniCv.getContext('2d');
const $score=document.getElementById('score'), $lines=document.getElementById('lines'), $level=document.getElementById('level');
const overlay=document.getElementById('overlay'), ovTitle=document.getElementById('ovTitle'), ovHint=document.getElementById('ovHint'), startBtn=document.getElementById('startBtn');

const SHAPES={
  I:[[0,1],[1,1],[2,1],[3,1]],
  O:[[1,0],[2,0],[1,1],[2,1]],
  T:[[1,0],[0,1],[1,1],[2,1]],
  S:[[1,0],[2,0],[0,1],[1,1]],
  Z:[[0,0],[1,0],[1,1],[2,1]],
  J:[[0,0],[0,1],[1,1],[2,1]],
  L:[[2,0],[0,1],[1,1],[2,1]]
};
const COLORS={I:'#4dd0e1',O:'#ffd166',T:'#b388ff',S:'#69f0ae',Z:'#ff6e7f',J:'#5c8dff',L:'#ffab5e'};
const PIVOT={I:[1.5,1.5],O:[1.5,.5],T:[1,1],S:[1,1],Z:[1,1],J:[1,1],L:[1,1]};

let grid, cur, hold=null, holdUsed=false, bag=[], queue=[];
let score=0, lines=0, level=1, dropInterval=1000, dropTimer=0, lastTime=0;
let running=false, paused=false, over=false, rafId=null;

function newBag(){
  const p=Object.keys(SHAPES);
  for(let i=p.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]];}
  return p;
}
function nextPiece(){
  while(queue.length<4){
    if(!bag.length) bag=newBag();
    queue.push(bag.shift());
  }
  return queue.shift();
}
function spawn(type){
  type = type || nextPiece();
  const cells=SHAPES[type].map(c=>c.slice());
  cur={type, cells, x:3, y:-1};
  if(collide(cur.cells,cur.x,cur.y)){ gameOver(); }
}
function collide(cells,x,y){
  return cells.some(([cx,cy])=>{
    const nx=x+cx, ny=y+cy;
    if(nx<0||nx>=COLS||ny>=ROWS) return true;
    return ny>=0 && grid[ny][nx];
  });
}
function rotate(dir){
  if(cur.type==='O') return;
  const [px,py]=PIVOT[cur.type];
  const rot=cur.cells.map(([x,y])=>{
    const rx=x-px, ry=y-py;
    return dir>0 ? [Math.round(px-ry), Math.round(py+rx)]
                 : [Math.round(px+ry), Math.round(py-rx)];
  });
  for(const k of [0,-1,1,-2,2]){
    if(!collide(rot,cur.x+k,cur.y)){ cur.cells=rot; cur.x+=k; return; }
    if(!collide(rot,cur.x+k,cur.y-1)){ cur.cells=rot; cur.x+=k; cur.y-=1; return; }
  }
}
function move(dx){ if(!collide(cur.cells,cur.x+dx,cur.y)) cur.x+=dx; }
function softDrop(){
  if(!collide(cur.cells,cur.x,cur.y+1)){ cur.y++; score+=1; }
  else lock();
  dropTimer=0;
}
function hardDrop(){
  let d=0;
  while(!collide(cur.cells,cur.x,cur.y+1)){ cur.y++; d++; }
  score+=d*2;
  lock();
}
function doHold(){
  if(holdUsed) return;
  holdUsed=true;
  const t=cur.type;
  if(hold){ const h=hold; hold=t; spawn(h); }
  else { hold=t; spawn(); }
}
function lock(){
  cur.cells.forEach(([cx,cy])=>{
    const ny=cur.y+cy;
    if(ny<0){ gameOver(); return; }
    grid[ny][cur.x+cx]=cur.type;
  });
  if(over) return;
  clearLines();
  holdUsed=false;
  spawn();
  dropTimer=0;
}
function clearLines(){
  let cleared=0;
  for(let y=ROWS-1;y>=0;y--){
    if(grid[y].every(v=>v)){
      grid.splice(y,1);
      grid.unshift(Array(COLS).fill(null));
      cleared++; y++;
    }
  }
  if(cleared){
    lines+=cleared;
    score+=[0,100,300,500,800][cleared]*level;
    const newLevel=Math.floor(lines/10)+1;
    if(newLevel!==level){ level=newLevel; dropInterval=Math.max(80,1000-(level-1)*85); }
  }
  updateHud();
}
function updateHud(){ $score.textContent=score; $lines.textContent=lines; $level.textContent=level; }

function ghostY(){
  let gy=cur.y;
  while(!collide(cur.cells,cur.x,gy+1)) gy++;
  return gy;
}
function drawCell(ctx,x,y,s,color,ghost){
  ctx.fillStyle=color;
  if(ghost){ ctx.globalAlpha=.22; }
  ctx.fillRect(x,y,s,s);
  ctx.globalAlpha=1;
  if(!ghost){
    ctx.fillStyle='rgba(255,255,255,.25)';
    ctx.fillRect(x,y,s,3);
    ctx.fillStyle='rgba(0,0,0,.28)';
    ctx.fillRect(x,y+s-3,s,3);
  }
  ctx.strokeStyle='rgba(0,0,0,.35)';
  ctx.strokeRect(x+.5,y+.5,s-1,s-1);
}
function draw(){
  bctx.clearRect(0,0,boardCv.width,boardCv.height);
  // grid lines
  bctx.strokeStyle='rgba(255,255,255,.04)';
  for(let x=1;x<COLS;x++){bctx.beginPath();bctx.moveTo(x*SIZE,0);bctx.lineTo(x*SIZE,ROWS*SIZE);bctx.stroke();}
  for(let y=1;y<ROWS;y++){bctx.beginPath();bctx.moveTo(0,y*SIZE);bctx.lineTo(COLS*SIZE,y*SIZE);bctx.stroke();}
  // stack
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    if(grid[y][x]) drawCell(bctx,x*SIZE,y*SIZE,SIZE,COLORS[grid[y][x]]);
  if(cur){
    // ghost
    const gy=ghostY();
    cur.cells.forEach(([cx,cy])=>{
      if(gy+cy>=0) drawCell(bctx,(cur.x+cx)*SIZE,(gy+cy)*SIZE,SIZE,COLORS[cur.type],true);
    });
    // piece
    cur.cells.forEach(([cx,cy])=>{
      if(cur.y+cy>=0) drawCell(bctx,(cur.x+cx)*SIZE,(cur.y+cy)*SIZE,SIZE,COLORS[cur.type]);
    });
  }
  drawPreview();
}
function drawMini(ctx,type,ox,oy,s){
  const cells=SHAPES[type];
  const xs=cells.map(c=>c[0]), ys=cells.map(c=>c[1]);
  const w=(Math.max(...xs)-Math.min(...xs)+1)*s, h=(Math.max(...ys)-Math.min(...ys)+1)*s;
  const bx=ox-w/2-Math.min(...xs)*s, by=oy-h/2-Math.min(...ys)*s;
  cells.forEach(([x,y])=>drawCell(ctx,bx+x*s,by+y*s,s,COLORS[type]));
}
function drawPreview(){
  nctx.clearRect(0,0,nextCv.width,nextCv.height);
  const preview=[...queue];
  while(preview.length<3){
    // peek into bag order isn't shown; just show what's queued
    break;
  }
  nmctx.clearRect(0,0,nextMiniCv.width,nextMiniCv.height);
  preview.slice(0,3).forEach((t,i)=>{
    drawMini(nctx,t,40,30+i*60,14);
    drawMini(nmctx,t,40,30+i*60,14);
  });
  hctx.clearRect(0,0,holdCv.width,holdCv.height);
  if(hold) drawMini(hctx,hold,40,30,14);
}

function loop(time){
  if(!running||paused||over) return;
  const dt=time-lastTime; lastTime=time;
  dropTimer+=dt;
  if(dropTimer>dropInterval){
    if(!collide(cur.cells,cur.x,cur.y+1)) cur.y++;
    else lock();
    dropTimer=0;
  }
  draw();
  rafId=requestAnimationFrame(loop);
}

function start(){
  grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
  score=0;lines=0;level=1;dropInterval=1000;dropTimer=0;
  hold=null;holdUsed=false;bag=[];queue=[];
  over=false;paused=false;running=true;
  updateHud(); spawn();
  overlay.style.display='none';
  lastTime=performance.now();
  cancelAnimationFrame(rafId);
  rafId=requestAnimationFrame(loop);
}
function gameOver(){
  over=true;running=false;
  ovTitle.textContent='GAME OVER';
  ovHint.textContent='SCORE: '+score;
  startBtn.textContent='RETRY';
  overlay.style.display='flex';
  draw();
}
function togglePause(){
  if(!running||over) return;
  paused=!paused;
  if(paused){
    ovTitle.textContent='PAUSED';
    ovHint.textContent='P 키로 계속';
    startBtn.textContent='RESUME';
    overlay.style.display='flex';
  }else{
    overlay.style.display='none';
    lastTime=performance.now();
    rafId=requestAnimationFrame(loop);
  }
}

startBtn.addEventListener('click',()=>{ paused&&!over ? togglePause() : start(); });

document.addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'){ togglePause(); return; }
  if(!running||paused||over) return;
  switch(e.key){
    case 'ArrowLeft': move(-1); break;
    case 'ArrowRight': move(1); break;
    case 'ArrowDown': softDrop(); break;
    case 'ArrowUp': case 'x': case 'X': rotate(1); break;
    case 'z': case 'Z': rotate(-1); break;
    case ' ': e.preventDefault(); hardDrop(); break;
    case 'c': case 'C': doHold(); break;
    default: return;
  }
  draw();
});

// touch buttons (with left/right hold-repeat)
let repeatTimer=null;
document.querySelectorAll('.touch button').forEach(btn=>{
  const act=btn.dataset.act;
  const fire=()=>{
    if(!running||paused||over) return;
    if(act==='left')move(-1);
    else if(act==='right')move(1);
    else if(act==='down')softDrop();
    else if(act==='rotate')rotate(1);
    else if(act==='drop')hardDrop();
    else if(act==='hold')doHold();
    draw();
  };
  btn.addEventListener('pointerdown',e=>{
    e.preventDefault(); fire();
    if(act==='left'||act==='right'||act==='down'){
      repeatTimer=setInterval(fire,110);
    }
  });
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>
    btn.addEventListener(ev,()=>{clearInterval(repeatTimer);}));
});

// board swipe gestures: 좌우 드래그 이동, 아래 드래그 소프트드롭, 아래 플릭 하드드롭, 탭 회전
(() => {
  let sx=0, sy=0, ax=0, ay=0, st=0, moved=false, dropped=false;
  const STEP=()=>boardCv.getBoundingClientRect().width/COLS; // 셀 1칸의 화면 px
  boardCv.addEventListener('pointerdown',e=>{
    sx=ax=e.clientX; sy=ay=e.clientY; st=performance.now(); moved=false; dropped=false;
    boardCv.setPointerCapture(e.pointerId);
  });
  boardCv.addEventListener('pointermove',e=>{
    if(!running||paused||over||dropped) return;
    const step=STEP();
    while(e.clientX-ax>step){ move(1); ax+=step; moved=true; }
    while(ax-e.clientX>step){ move(-1); ax-=step; moved=true; }
    while(e.clientY-ay>step){
      if(!collide(cur.cells,cur.x,cur.y+1)){ cur.y++; score+=1; updateHud(); }
      ay+=step; moved=true;
    }
    if(moved) draw();
  });
  boardCv.addEventListener('pointerup',e=>{
    if(!running||paused||over) return;
    const dt=performance.now()-st, dy=e.clientY-sy, dx=e.clientX-sx;
    if(!moved && Math.abs(dx)<10 && Math.abs(dy)<10){ rotate(1); draw(); return; }
    if(dy>60 && dt<250 && Math.abs(dx)<Math.abs(dy)){ dropped=true; hardDrop(); draw(); }
  });
})();

// initial render
grid=Array.from({length:ROWS},()=>Array(COLS).fill(null));
draw();
})();
</script>
</body>
</html>
